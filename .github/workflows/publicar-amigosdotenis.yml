# Publica o app Amigos do Tênis no GitHub Pages.
# Roda sozinho a cada push que mexer na pasta do app.
name: Publicar Amigos do Tênis

on:
  push:
    branches: [claude/tennis-matchmaking-app-duw17i]
    paths:
      - 'amigosdotenis/**'
      - '.github/workflows/publicar-amigosdotenis.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# uma publicação por vez; se vier outra, cancela a anterior
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  montar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: amigosdotenis/package-lock.json

      - name: Instalar dependências
        working-directory: amigosdotenis
        run: npm ci

      - name: Montar o app
        working-directory: amigosdotenis
        run: npm run build

      - name: Ajustes do GitHub Pages
        working-directory: amigosdotenis
        run: |
          # sem isso o Pages ignora pastas que começam com _
          touch dist/.nojekyll
          # qualquer endereço desconhecido cai no app em vez de dar 404
          cp dist/index.html dist/404.html

      # liga o Pages no repositório automaticamente, se ainda não estiver
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: amigosdotenis/dist

  publicar:
    needs: montar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicacao.outputs.page_url }}
    steps:
      - id: publicacao
        uses: actions/deploy-pages@v4
